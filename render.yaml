services:
  - type: web
    name: secondtrip-api
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: uv sync --locked --no-dev
    preDeployCommand: uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: UV_VERSION
        value: 0.10.12
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: SecondTrip
      - key: APP_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: COOKIE_DOMAIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_PROVIDER
        value: r2
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: WORKER_BATCH_SIZE
        value: "5"
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: SecondTrip
      - key: BILLING_PROVIDER
        value: noop

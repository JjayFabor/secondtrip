[project]
name = "secondtrip-backend"
version = "0.1.0"
description = "SecondTrip — callback & rework analytics API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "structlog==26.1.0",
    "uuid6==2025.0.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "httpx==0.28.1",
    "charset-normalizer==3.5.1",
    "phonenumbers==9.0.39",
    "aioboto3==15.5.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "asgi-lifespan==2.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF002/003: this codebase's prose (docstrings, comments) deliberately
# uses em/en dashes, matching docs/architecture/'s own style — not a code
# quality issue.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own required idiom is `param: T = Depends(...)` — the call
# in the default IS the mechanism, not a mutable-default bug. Query/Path
# get the same treatment for the same reason.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# Alembic's own --autogenerate formatter, not hand-written code — fighting
# its line length and import order every revision isn't worth it. Real
# mistakes (F401 unused imports, F821 undefined names, ...) still fail.
"migrations/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "uuid6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aioboto3.*", "aiobotocore.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

# See docs/architecture/01-system-architecture.md §5 rule list. These are
# `forbidden` contracts rather than one `layers` contract because
# core/db/shared are siblings that legitimately depend on EACH OTHER
# (db imports core for TenantContext/settings/ids) — a `layers` contract
# with them joined by `|` as one rank would forbid that too, which is not
# the actual rule. What's actually forbidden is core/db/shared/providers
# reaching UP into modules or api.

[[tool.importlinter.contracts]]
name = "core/db/shared never import modules or api"
type = "forbidden"
source_modules = ["app.core", "app.db", "app.shared"]
forbidden_modules = ["app.modules", "app.api"]

[[tool.importlinter.contracts]]
name = "providers never import modules or api"
type = "forbidden"
source_modules = ["app.providers"]
forbidden_modules = ["app.modules", "app.api"]

[[tool.importlinter.contracts]]
name = "modules never import api"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "modules use sibling public boundaries"
type = "forbidden"
source_modules = ["app.modules.*"]
forbidden_modules = ["app.modules.*.models", "app.modules.*.repository"]
allow_indirect_imports = true
broken_contract_guidance = "Import a sibling service, schema, or sanctioned read_models module instead."

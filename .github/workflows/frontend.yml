name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: tsc --noEmit
        run: pnpm typecheck

      - name: next build
        run: pnpm build

      # No frontend test framework chosen yet — see
      # docs/architecture/19-testing-strategy.md. This step joins the
      # pipeline once one is (vitest, per 16-repository-structure.md).

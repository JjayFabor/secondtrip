name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "packages/contracts/src/api.d.ts"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "packages/contracts/src/api.d.ts"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: tsc --noEmit
        run: pnpm typecheck

      - name: next build
        run: pnpm build

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No frontend test framework chosen yet — see
      # docs/architecture/19-testing-strategy.md. This step joins the
      # pipeline once one is (vitest, per 16-repository-structure.md).

name: secondtrip

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: secondtrip_owner
      POSTGRES_PASSWORD: secondtrip_owner_dev_only
      POSTGRES_DB: secondtrip_dev
    ports:
      # Non-default host port — avoids colliding with any other local
      # Postgres instance (native or another project's containers).
      - "5439:5432"
    volumes:
      - secondtrip_pg_data:/var/lib/postgresql/data
      # Runs once, on first container creation, AS secondtrip_owner —
      # The first script creates the local-only app role; the shared bootstrap
      # then verifies it is non-elevated and grants current/future privileges.
      - ./infra/neon/local-role.sql:/docker-entrypoint-initdb.d/00-local-role.sql:ro
      - ./infra/neon/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondtrip_owner -d secondtrip_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  secondtrip_pg_data:
